name: Coleta de dados

# A cada 10 minutos: PurpleAir + estações locais -> IQAr -> Firestore (portal/estado).
# Segredos: FIREBASE_SERVICE_ACCOUNT (JSON da conta de serviço) e PURPLEAIR_API_KEY (opcional
# até a chave chegar; sem ela a coleta só usa as estações locais ou não publica nada).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: codigo-fonte/coletor/requirements.txt
      - run: pip install -r codigo-fonte/coletor/requirements.txt
      - name: Coletar, calcular IQAr e publicar
        run: python codigo-fonte/coletor/coletar.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}
